[project]
name = "pinn-monorepo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "pyfiglet>=1.0.4",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[tool.uv.workspace]
members = [
    "libs/pinn",
]

[project.scripts]
train-harmonic = "experiments.harmonic_oscillator.train:app"
train-burgers = "experiments.burgers.train:app"
train-schrodinger = "experiments.schrodinger.train:app"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "experiments"
module-root = ""