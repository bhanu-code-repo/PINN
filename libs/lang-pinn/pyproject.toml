[project]
name = "lang-pinn"
version = "0.1.0"
description = "Lang-PINN: LLM-guided Physics-Informed Neural Network construction and training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llm-provider",
    "pinn",
    "sympy>=1.13.0",
]

[tool.uv.sources]
llm-provider = { workspace = true }
pinn = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
