[project]
name = "api"
version = "0.1.0"
description = "FastAPI admin server with Jinja2 templates for knowledge base management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "rag",
    "llm-provider",
    "loguru>=0.7.0",
    "bcrypt>=4.0.0",
    "markdown>=3.6",
    "typer>=0.27.0",
]

[tool.uv.sources]
rag = { workspace = true }
llm-provider = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
