{% extends "layouts/base-auth.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<body class="app app-login p-0">
    <div class="row g-0 app-auth-wrapper">
        <div class="col-12 col-md-7 col-lg-6 auth-main-col text-center p-5">
            <div class="d-flex flex-column align-content-end">
                <div class="app-auth-body mx-auto">
                    <div class="app-auth-branding mb-4">
                        <a class="app-logo" href="{{ url_for('dashboard') }}">
                            <img class="logo-icon me-2" src="{{ url_for('static', path='assets/images/app-logo.svg') }}" alt="logo">
                        </a>
                    </div>
                    <h2 class="auth-heading text-center mb-5">PINN Knowledge Admin</h2>

                    {% if error %}
                    <div class="alert alert-danger mb-3">{{ error }}</div>
                    {% endif %}

                    <div class="auth-form-container text-start">
                        <form class="auth-form login-form" method="post" action="{{ url_for('login') }}">
                            <div class="email mb-3">
                                <label class="sr-only" for="username">Username</label>
                                <input id="username" name="username" type="text" class="form-control" placeholder="Username" required>
                            </div>
                            <div class="password mb-3">
                                <label class="sr-only" for="password">Password</label>
                                <input id="password" name="password" type="password" class="form-control" placeholder="Password" required>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn app-btn-primary w-100 theme-btn mx-auto">Log In</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-5 col-lg-6 h-100 auth-background-col">
            <div class="auth-background-holder"></div>
            <div class="auth-background-mask"></div>
            <div class="auth-background-overlay p-3 p-lg-5">
                <div class="d-flex flex-column align-content-end h-100">
                    <div class="h-100"></div>
                    <div class="overlay-content p-3 p-lg-4 rounded">
                        <h5 class="mb-3 overlay-title">PINN Knowledge Base</h5>
                        <div>Manage collections, documents, and access control for your physics-informed neural network knowledge base.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
{% endblock %}
