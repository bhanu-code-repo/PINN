[project]
name = "llm-provider"
version = "0.1.0"
description = "LLM abstraction layer with LiteLLM — Ollama (local + cloud) out of the box, any provider via config"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50.0",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
